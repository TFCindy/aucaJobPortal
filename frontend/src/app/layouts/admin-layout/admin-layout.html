<div class="flex min-h-screen">
  
  <div class="w-64 bg-blue-900 text-white min-h-screen flex flex-col fixed">
    
    <div class="p-4 border-b border-blue-800">
      <h1 class="text-xl font-bold">AUCA Admin</h1>
    </div>

    <nav class="flex-1 p-4 space-y-1">
      <a routerLink="/admin/dashboard" routerLinkActive="bg-blue-800"
         class="block px-3 py-2 rounded-lg hover:bg-blue-800 transition text-sm">
         Dashboard
      </a>
      <a routerLink="/admin/users" routerLinkActive="bg-blue-800"
         class="block px-3 py-2 rounded-lg hover:bg-blue-800 transition text-sm">
         Users
      </a>
      <a routerLink="/admin/roles" routerLinkActive="bg-blue-800"
         class="block px-3 py-2 rounded-lg hover:bg-blue-800 transition text-sm">
         Roles & Permissions
      </a>
      <a routerLink="/admin/job-approval" routerLinkActive="bg-blue-800"
         class="block px-3 py-2 rounded-lg hover:bg-blue-800 transition text-sm">
         Job Approval
      </a>
      <a routerLink="/admin/audit-logs" routerLinkActive="bg-blue-800"
         class="block px-3 py-2 rounded-lg hover:bg-blue-800 transition text-sm">
         Audit Logs
      </a>
      <a routerLink="/admin/counselors" routerLinkActive="bg-blue-800"
         class="block px-3 py-2 rounded-lg hover:bg-blue-800 transition text-sm">
         Career Counselors
      </a>
    </nav>

    <div class="p-4 border-t border-blue-800">
      <button (click)="logout()" class="w-full text-left px-3 py-2 rounded-lg hover:bg-red-800 transition text-sm">
         Logout
      </button>
    </div>
  </div>

  <div class="ml-64 flex-1">
    <router-outlet></router-outlet>
  </div>

</div>
