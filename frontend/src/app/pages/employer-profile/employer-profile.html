<!-- src/app/pages/employer-profile/employer-profile.html -->
<app-navbar></app-navbar>

<div class="max-w-4xl mx-auto px-4 py-8">

  <!-- Header -->
  <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4 mb-8">
    <div>
      <h1 class="text-3xl font-bold text-gray-900">Employer Profile</h1>
      <p class="text-gray-500 text-sm mt-1">Update your company information</p>
    </div>
  </div>

  <!-- Success Message -->
  <div *ngIf="successMessage" class="mb-4 p-4 bg-green-50 border border-green-200 text-green-700 rounded-xl flex items-center justify-between">
    <span>{{ successMessage }}</span>
    <button (click)="clearMessages()" class="text-green-700 hover:text-green-900 font-bold text-lg leading-none">&times;</button>
  </div>

  <!-- Error Message -->
  <div *ngIf="errorMessage" class="mb-4 p-4 bg-red-50 border border-red-200 text-red-700 rounded-xl flex items-center justify-between">
    <span>{{ errorMessage }}</span>
    <button (click)="clearMessages()" class="text-red-700 hover:text-red-900 font-bold text-lg leading-none">&times;</button>
  </div>

  <!-- Loading State -->
  <div *ngIf="isLoading" class="flex flex-col items-center justify-center py-20">
    <div class="w-10 h-10 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin"></div>
    <p class="text-gray-400 text-sm mt-4">Loading profile...</p>
  </div>

  <!-- Profile Form -->
  <form *ngIf="!isLoading" [formGroup]="form" (ngSubmit)="onSubmit()" enctype="multipart/form-data" class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">

    <!-- Company Logo Upload -->
    <div class="mb-6">
      <label class="block text-sm font-medium text-gray-700 mb-1">Company Logo</label>
      <div class="flex flex-col sm:flex-row items-start sm:items-center gap-4">
        <div class="w-32 h-32 rounded-lg border-2 border-dashed border-gray-300 overflow-hidden flex-shrink-0 bg-gray-50 flex items-center justify-center">
          <img *ngIf="logoPreview" [src]="logoPreview" alt="Logo" class="w-full h-full object-contain">
          <span *ngIf="!logoPreview" class="text-gray-400 text-sm">No logo</span>
        </div>
        <div>
          <input type="file" (change)="onLogoSelected($event)" accept="image/*" 
                 class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
          <p class="text-xs text-gray-400 mt-1">Upload a logo (JPEG, PNG, GIF, WEBP - Max 5MB)</p>
          <button *ngIf="logoPreview && existingLogoUrl" type="button" (click)="removeLogo()" 
                  class="text-xs text-red-600 hover:text-red-800 mt-1">Remove New Logo</button>
        </div>
      </div>
    </div>

    <!-- Two Column Layout -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

      <!-- Company Name -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Company Name <span class="text-red-500">*</span></label>
        <input type="text" formControlName="companyName" 
               class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
               placeholder="Enter company name">
        <div *ngIf="form.get('companyName')?.invalid && form.get('companyName')?.touched" class="text-red-500 text-xs mt-1">
          Company name is required
        </div>
      </div>

      <!-- Email (read-only) -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" formControlName="email" 
               class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm bg-gray-50 cursor-not-allowed" 
               readonly>
      </div>

      <!-- Phone -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
        <input type="tel" formControlName="phone" 
               class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
               placeholder="e.g., 0788888888">
      </div>

      <!-- Industry -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Industry</label>
        <select formControlName="industry" 
                class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition bg-white">
          <option value="">Select Industry</option>
          <option value="Technology">Technology</option>
          <option value="Finance">Finance</option>
          <option value="Healthcare">Healthcare</option>
          <option value="Education">Education</option>
          <option value="Manufacturing">Manufacturing</option>
          <option value="Retail">Retail</option>
          <option value="Construction">Construction</option>
          <option value="Hospitality">Hospitality</option>
          <option value="Agriculture">Agriculture</option>
          <option value="Government">Government</option>
          <option value="Nonprofit">Nonprofit</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <!-- Company Size -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Company Size</label>
        <select formControlName="companySize" 
                class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition bg-white">
          <option value="">Select Company Size</option>
          <option value="1-10">1-10 employees</option>
          <option value="11-50">11-50 employees</option>
          <option value="51-200">51-200 employees</option>
          <option value="201-500">201-500 employees</option>
          <option value="501-1000">501-1000 employees</option>
          <option value="1000+">1000+ employees</option>
        </select>
      </div>

      <!-- Location -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Location</label>
        <input type="text" formControlName="location" 
               class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
               placeholder="e.g., Kigali, Rwanda">
      </div>

      <!-- Company Website -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Company Website</label>
        <input type="url" formControlName="companyWebsite" 
               class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
               placeholder="https://www.example.com">
      </div>

      <!-- Company Description -->
      <div class="mb-4 md:col-span-2">
        <label class="block text-sm font-medium text-gray-700 mb-1">Company Description</label>
        <textarea formControlName="companyDescription" rows="4" 
                  class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                  placeholder="Describe your company, its mission, and what you do..."></textarea>
      </div>

      <!-- Email Notifications -->
      <div class="mb-4 md:col-span-2">
        <label class="flex items-center cursor-pointer">
          <input type="checkbox" formControlName="emailNotificationsEnabled" 
                 class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
          <span class="ml-2 text-sm text-gray-700">Receive email notifications</span>
        </label>
      </div>

    </div>

    <!-- Submit Button -->
    <div class="flex gap-3 mt-6 pt-6 border-t border-gray-200">
      <button type="submit" [disabled]="isSubmitting || form.invalid"
              class="bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 text-white px-8 py-2.5 rounded-lg text-sm font-medium transition duration-200 shadow-sm hover:shadow">
        {{ isSubmitting ? 'Saving...' : 'Save Changes' }}
      </button>
      <button type="button" (click)="goToDashboard()"
              class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-6 py-2.5 rounded-lg text-sm font-medium transition duration-200">
        Cancel
      </button>
    </div>

  </form>

</div>
