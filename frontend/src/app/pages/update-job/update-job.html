<app-navbar></app-navbar>

<div class="max-w-4xl mx-auto px-4 py-8">

  <div class="mb-4">
    <a [routerLink]="['/employer/jobs', jobId]" class="text-blue-800 hover:underline text-sm">← Back to Job</a>
  </div>

  <h1 class="text-2xl font-bold text-gray-800">Update Job</h1>

  <div *ngIf="errorMessage" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mt-4">
    {{ errorMessage }}
  </div>

  <div *ngIf="successMessage" class="bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-lg mt-4">
    {{ successMessage }}
  </div>

  <div *ngIf="isLoading" class="flex justify-center items-center h-64">
    <div class="text-gray-500 text-sm">Loading job details...</div>
  </div>

  <form *ngIf="!isLoading" [formGroup]="form" (ngSubmit)="onUpdate()" class="bg-white rounded-xl shadow p-6 mt-6">
    
    <!-- Title -->
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700">Title</label>
      <input type="text" formControlName="title" 
             class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
      <div *ngIf="form.get('title')?.invalid && form.get('title')?.touched" class="text-red-500 text-sm mt-1">
        Title is required
      </div>
    </div>

    <!-- Description -->
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700">Description</label>
      <textarea formControlName="description" rows="5" 
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"></textarea>
      <div *ngIf="form.get('description')?.invalid && form.get('description')?.touched" class="text-red-500 text-sm mt-1">
        Description is required
      </div>
    </div>

    <!-- Requirements -->
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700">Requirements</label>
      <textarea formControlName="requirements" rows="3" 
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                placeholder="Enter each requirement on a new line"></textarea>
    </div>

    <!-- Responsibilities -->
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700">Responsibilities</label>
      <textarea formControlName="responsibilities" rows="3" 
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                placeholder="Enter each responsibility on a new line"></textarea>
    </div>

    <!-- Location -->
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700">Location</label>
      <input type="text" formControlName="location" 
             class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
      <div *ngIf="form.get('location')?.invalid && form.get('location')?.touched" class="text-red-500 text-sm mt-1">
        Location is required
      </div>
    </div>

    <!-- Job Types -->
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700">Job Types</label>
      <div class="flex flex-wrap gap-2 mt-1">
        <label *ngFor="let type of jobTypes" class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" 
                 [value]="type.id" 
                 (change)="onJobTypeChange($event)"
                 [checked]="isJobTypeSelected(type.id)"
                 class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
          <span class="text-sm text-gray-700">{{ type.name }}</span>
        </label>
      </div>
      <div *ngIf="form.get('jobTypeIds')?.invalid && form.get('jobTypeIds')?.touched" class="text-red-500 text-sm mt-1">
        At least one job type must be selected
      </div>
    </div>

    <!-- Openings -->
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700">Openings</label>
      <input type="number" formControlName="openings" 
             class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
      <div *ngIf="form.get('openings')?.invalid && form.get('openings')?.touched" class="text-red-500 text-sm mt-1">
        Openings must be between 1 and 100
      </div>
    </div>

    <!-- Deadline -->
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700">Application Deadline</label>
      <input type="date" formControlName="deadlineDate" 
             class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
    </div>

    <!-- Submit -->
    <div class="flex gap-3">
      <button type="submit" [disabled]="isSubmitting" 
              class="bg-blue-800 hover:bg-blue-900 disabled:bg-blue-300 text-white px-6 py-2 rounded-lg text-sm font-medium transition">
        {{ isSubmitting ? 'Updating...' : 'Update Job' }}
      </button>
      <a [routerLink]="['/employer/jobs', jobId]" 
         class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-6 py-2 rounded-lg text-sm font-medium transition">
        Cancel
      </a>
    </div>

  </form>

</div>
