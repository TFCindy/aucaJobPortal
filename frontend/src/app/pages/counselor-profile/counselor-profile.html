<!-- src/app/pages/counselor-profile/counselor-profile.html -->
<app-navbar></app-navbar>

<div class="max-w-4xl mx-auto px-4 py-8">

  <!-- Header -->
  <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4 mb-8">
    <div>
      <h1 class="text-3xl font-bold text-gray-900">Career Counselor Profile</h1>
      <p class="text-gray-500 text-sm mt-1">Update your professional information</p>
    </div>
  </div>

  <!-- Success Message -->
  <div *ngIf="successMessage" class="mb-4 p-4 bg-green-50 border border-green-200 text-green-700 rounded-xl flex items-center justify-between">
    <span>{{ successMessage }}</span>
    <button (click)="clearMessages()" class="text-green-700 hover:text-green-900 font-bold text-lg leading-none">&times;</button>
  </div>

  <!-- Error Message -->
  <div *ngIf="errorMessage" class="mb-4 p-4 bg-red-50 border border-red-200 text-red-700 rounded-xl flex items-center justify-between">
    <span>{{ errorMessage }}</span>
    <button (click)="clearMessages()" class="text-red-700 hover:text-red-900 font-bold text-lg leading-none">&times;</button>
  </div>

  <!-- Loading State -->
  <div *ngIf="isLoading" class="flex flex-col items-center justify-center py-20">
    <div class="w-10 h-10 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin"></div>
    <p class="text-gray-400 text-sm mt-4">Loading profile...</p>
  </div>

  <!-- Profile Form -->
  <form *ngIf="!isLoading" [formGroup]="form" (ngSubmit)="onSubmit()" class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">

    <!-- Two Column Layout -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

      <!-- Full Name (read-only) -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
        <input type="text" formControlName="fullName" 
               class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm bg-gray-50 cursor-not-allowed" 
               readonly>
      </div>

      <!-- Email (read-only) -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" formControlName="email" 
               class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm bg-gray-50 cursor-not-allowed" 
               readonly>
      </div>

      <!-- Phone -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
        <input type="tel" formControlName="phone" 
               class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
               placeholder="e.g., 0788888888">
      </div>

      <!-- Department -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Department <span class="text-red-500">*</span></label>
        <input type="text" formControlName="department" 
               class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
               placeholder="e.g., Career Services">
        <div *ngIf="form.get('department')?.invalid && form.get('department')?.touched" class="text-red-500 text-xs mt-1">
          Department is required
        </div>
      </div>

      <!-- Title -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Title <span class="text-red-500">*</span></label>
        <input type="text" formControlName="title" 
               class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
               placeholder="e.g., Senior Career Counselor">
        <div *ngIf="form.get('title')?.invalid && form.get('title')?.touched" class="text-red-500 text-xs mt-1">
          Title is required
        </div>
      </div>

      <!-- Specialization -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Specialization</label>
        <input type="text" formControlName="specialization" 
               class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
               placeholder="e.g., IT Career Counseling, University Admissions">
      </div>

      <!-- Years of Experience -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Years of Experience</label>
        <input type="number" formControlName="yearsOfExperience" 
               class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
               placeholder="5" min="0" max="50">
        <div *ngIf="form.get('yearsOfExperience')?.invalid && form.get('yearsOfExperience')?.touched" class="text-red-500 text-xs mt-1">
          Must be between 0 and 50
        </div>
      </div>

      <!-- Office Location -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Office Location</label>
        <input type="text" formControlName="officeLocation" 
               class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
               placeholder="e.g., Room 201, Career Services Building">
      </div>

      <!-- Bio -->
      <div class="mb-4 md:col-span-2">
        <label class="block text-sm font-medium text-gray-700 mb-1">Bio</label>
        <textarea formControlName="bio" rows="4" 
                  class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                  placeholder="Tell students about yourself, your experience, and how you can help them..."></textarea>
      </div>

    </div>

    <!-- Submit Button -->
    <div class="flex gap-3 mt-6 pt-6 border-t border-gray-200">
      <button type="submit" [disabled]="isSubmitting || form.invalid"
              class="bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 text-white px-8 py-2.5 rounded-lg text-sm font-medium transition duration-200 shadow-sm hover:shadow">
        {{ isSubmitting ? 'Saving...' : 'Save Changes' }}
      </button>
      <button type="button" (click)="goToDashboard()"
              class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-6 py-2.5 rounded-lg text-sm font-medium transition duration-200">
        Cancel
      </button>
    </div>

  </form>

</div>
