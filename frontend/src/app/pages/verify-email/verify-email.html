<div class="min-h-screen bg-gradient-to-br from-blue-40 to-blue-200 flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-xl shadow-2xl p-8 text-center">

    <div class="flex justify-center mb-6">
      <img src="/logo.png" alt="Auca LOGO" class="h-16" style="max-width: 200px;">
    </div>

    @if (isVerifying) {
      <p class="text-gray-600">Verifying your email...</p>
    }

    @if (!isVerifying && !errorMessage) {
      <div class="bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-lg">
        Email verified successfully! Redirecting you to login...
      </div>
    }

    @if (!isVerifying && errorMessage) {
      <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg">
        {{ errorMessage }}
      </div>
      <a routerLink="/login" class="text-blue-900 hover:underline font-medium mt-4 inline-block">Go to Login</a>
    }

  </div>
</div>
